<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scanner</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='welcome.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="video-container">
        <video autoplay muted loop>
            <source src="{{ url_for('static', filename='video/welcome1.mp4') }}" type="video/mp4">
            Your browser does not support the video tag. Please upgrade your browser to view the video.
        </video>

        <div class="form-container">
            <form id="scanForm">
                <label for="url">Website URL:</label>
                <input type="text" id="url" name="url" required placeholder="http://example.com">
              
                <label for="max_links">Max Links to Crawl:</label>
                <input type="number" id="max_links" name="max_links" value="50" min="1" required>
              
                <button type="submit">Start Scan</button>
            </form>
              
            <div id="progressWrapper" style="display:none;">
                <p>Scanning in progress... Please wait.</p>
                <progress id="scanProgress" value="0" max="100" style="width: 100%;"></progress>
                <p id="progressText">0% Complete</p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("scanForm");
        const progressBar = document.getElementById("scanProgress");
        const progressWrapper = document.getElementById("progressWrapper");
        const progressText = document.getElementById("progressText");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const urlInput = document.getElementById("url").value.trim();
            const maxLinks = parseInt(document.getElementById("max_links").value);

            // Validate URL
            const urlPattern = /^https?:\/\/[\w\-]+(\.[\w\-]+)+[/#?]?.*$/;
            if (!urlPattern.test(urlInput)) {
                alert("⚠️ Please enter a valid URL (e.g., http://example.com)");
                return;
            }

            progressWrapper.style.display = "block";
            progressBar.value = 0;
            progressText.textContent = "0% Complete";

            // Start SSE for progress updates
            const eventSource = new EventSource("/progress");
            eventSource.onmessage = (event) => {
                const progress = parseInt(event.data);
                const percentage = Math.min((progress / maxLinks) * 100, 100);
                progressBar.value = percentage;
                progressText.textContent = `${Math.round(percentage)}% Complete`;
            };

            try {
                const response = await fetch("/scan", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: urlInput, max_links: maxLinks }),
                });

                const result = await response.json();
                eventSource.close();

                progressBar.value = 100;
                progressText.textContent = "100% Complete";

                if (result.status === "success") {
                    alert("✅ Scan complete! Risk Level: " + result.risk_level);
                    window.open(result.report_path, '_blank');
                } else {
                    alert("⚠️ Scan error: " + result.message);
                }
            } catch (err) {
                eventSource.close();
                progressBar.value = 100;
                progressText.textContent = "100% Complete";
                alert("❌ Unexpected error: " + err.message);
                window.open('/static/scan_report.pdf', '_blank');
            }
        });
    </script>
</body>
</html>
